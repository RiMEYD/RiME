<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>GitHub 파일 커밋 게시판</title>
  <style>
    body { max-width: 600px; margin: 30px auto; font-family: sans-serif; }
    input, textarea { width: 100%; margin: 8px 0; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; background: #2ea44f; color: white; border: none; cursor: pointer; }
    .post { border-bottom: 1px solid #ddd; padding: 10px 0; }
  </style>
</head>
<body>
  <h2>GitHub JSON 기반 게시판</h2>
  <input type="text" id="name" placeholder="작성자">
  <textarea id="message" rows="3" placeholder="내용"></textarea>
  <button id="saveBtn">GitHub에 커밋하기</button>

  <div id="postsList"></div>

  <script>
    // ⚠️ 보안 경고: 실제 토큰이 공개되면 저장소 변조 위험이 있습니다.
    const GITHUB_TOKEN = "YOUR_GITHUB_PERSONAL_ACCESS_TOKEN";
    const OWNER = "YOUR_GITHUB_USERNAME";
    const REPO = "YOUR_REPO_NAME";
    const FILE_PATH = "posts.json";

    const apiEndpoint = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;

    // 1. GitHub에서 posts.json 파일 가져오기
    async function fetchPosts() {
      try {
        const res = await fetch(apiEndpoint, {
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        if (res.status === 404) return { sha: null, data: [] };
        
        const json = await res.json();
        // GitHub API는 파일 내용을 Base64로 인코딩하여 반환합니다.
        const contentStr = decodeURIComponent(escape(atob(json.content)));
        return { sha: json.sha, data: JSON.parse(contentStr) };
      } catch (e) {
        console.error("데이터 로드 실패:", e);
        return { sha: null, data: [] };
      }
    }

    // 2. 화면에 표시
    async function renderPosts() {
      const { data } = await fetchPosts();
      const listDiv = document.getElementById("postsList");
      listDiv.innerHTML = "<h3>글 목록</h3>";
      data.reverse().forEach(post => {
        const item = document.createElement("div");
        item.className = "post";
        item.innerHTML = `<strong>${post.name}</strong> <small>(${post.time})</small><p>${post.message}</p>`;
        listDiv.appendChild(item);
      });
    }

    // 3. GitHub API로 posts.json 파일에 새 커밋 푸시
    document.getElementById("saveBtn").addEventListener("click", async () => {
      const name = document.getElementById("name").value.trim();
      const message = document.getElementById("message").value.trim();
      if (!name || !message) return alert("입력값을 확인하세요.");

      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      btn.innerText = "GitHub에 커밋 중...";

      try {
        const { sha, data } = await fetchPosts();
        
        // 새 글 추가
        data.push({
          name: name,
          message: message,
          time: new Date().toLocaleString()
        });

        // Base64 UTF-8 인코딩
        const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));

        // GitHub REST API 파일 수정 (커밋 생성)
        const commitRes = await fetch(apiEndpoint, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${GITHUB_TOKEN}`,
            "Accept": "application/vnd.github.v3+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `새 게시글 작성: ${name}`,
            content: updatedContent,
            sha: sha || undefined
          })
        });

        if (!commitRes.ok) throw new Error("커밋 실패: " + commitRes.statusText);

        alert("GitHub에 성공적으로 저장되었습니다!");
        document.getElementById("name").value = "";
        document.getElementById("message").value = "";
        await renderPosts();
      } catch (err) {
        alert("오류: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "GitHub에 커밋하기";
      }
    });

    renderPosts();
  </script>
</body>
</html>
