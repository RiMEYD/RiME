<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나만의 편의 도구 모음</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --primary: #2563eb;
      --hover-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    /* 다크모드 지원 */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
        --border-color: #334155;
        --primary: #38bdf8;
        --hover-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2.5rem 1.5rem;
      min-height: 100vh;
    }

    header {
      max-width: 900px;
      margin: 0 auto 2.5rem;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-sub);
      font-size: 1rem;
    }

    .grid-container {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .tool-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .tool-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--hover-shadow);
      border-color: var(--primary);
    }

    .tool-icon {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .tool-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tool-card:hover .tool-title {
      color: var(--primary);
    }

    .tool-desc {
      font-size: 0.9rem;
      color: var(--text-sub);
      line-height: 1.4;
    }

    .arrow {
      font-size: 1rem;
      color: var(--text-sub);
      transition: transform 0.15s ease;
    }

    .tool-card:hover .arrow {
      transform: translateX(4px);
      color: var(--primary);
    }

    footer {
      max-width: 900px;
      margin: 3rem auto 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ 나만의 도구 모음</h1>
    <p>자주 사용하는 웹 편의 프로그램을 한눈에 확인하고 실행하세요.</p>
  </header>

  <main class="grid-container">
    <!-- 프로그램 1: 하위 폴더에 있는 프로그램 연결 예시 -->
    <a href="./calculator/" class="tool-card">
      <div>
        <div class="tool-icon">🧮</div>
        <div class="tool-title">
          <span>다기능 계산기</span>
          <span class="arrow">→</span>
        </div>
        <p class="tool-desc">간단한 사칙연산과 공학용 수식을 계산할 수 있는 도구입니다.</p>
      </div>
    </a>

    <!-- 프로그램 2: 단위 변환기 연결 예시 -->
    <a href="./unit-converter/" class="tool-card">
      <div>
        <div class="tool-icon">🔄</div>
        <div class="tool-title">
          <span>단위 변환기</span>
          <span class="arrow">→</span>
        </div>
        <p class="tool-desc">길이, 무게, 환율 및 데이터 단위를 실시간으로 변환합니다.</p>
      </div>
    </a>

    <!-- 프로그램 3: 메모장 연결 예시 -->
    <a href="./memo/" class="tool-card">
      <div>
        <div class="tool-icon">📝</div>
        <div class="tool-title">
          <span>빠른 메모장</span>
          <span class="arrow">→</span>
        </div>
        <p class="tool-desc">브라우저 로컬 저장소를 활용해 사라지지 않는 텍스트 메모 공간입니다.</p>
      </div>
    </a>

    <!-- 프로그램 4: 파일 하나짜리(단일 html) 연결 예시 -->
    <a href="./timer.html" class="tool-card">
      <div>
        <div class="tool-icon">⏱️</div>
        <div class="tool-title">
          <span>뽀모도로 타이머</span>
          <span class="arrow">→</span>
        </div>
        <p class="tool-desc">집중 시간과 휴식 시간을 관리해 주는 심플한 타이머입니다.</p>
      </div>
    </a>
  </main>

  <footer>
    <p>Personal Web Tools Dashboard</p>
  </footer>

</body>
</html>
