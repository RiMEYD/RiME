<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나만의 편의 도구 모음</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --primary: #2563eb;
      --hover-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
        --border-color: #334155;
        --primary: #38bdf8;
        --hover-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2.5rem 1.5rem;
      min-height: 100vh;
    }
    header {
      max-width: 900px;
      margin: 0 auto 2.5rem;
      text-align: center;
    }
    header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    header p { color: var(--text-sub); }
    .grid-container {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }
    .tool-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .tool-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--hover-shadow);
      border-color: var(--primary);
    }
    .tool-icon { font-size: 2rem; margin-bottom: 1rem; }
    .tool-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tool-card:hover .tool-title { color: var(--primary); }
    .tool-desc { font-size: 0.9rem; color: var(--text-sub); line-height: 1.4; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ 나만의 도구 모음</h1>
    <p>자주 사용하는 웹 편의 프로그램을 한눈에 확인하고 실행하세요.</p>
  </header>

  <main class="grid-container">
    <!-- [핵심] 방금 만든 실시간 DB 게시판 연결 -->
    <a href="./textcopy.html" class="tool-card">
      <div>
        <div class="tool-icon">📋</div>
        <div class="tool-title">
          <span>실시간 텍스트 공유 보드</span>
          <span>→</span>
        </div>
        <p class="tool-desc">입력한 텍스트가 데이터베이스에 저장되어 누구나 확인하고 원클릭으로 복사할 수 있습니다.</p>
      </div>
    </a>
  </main>

</body>
</html>
